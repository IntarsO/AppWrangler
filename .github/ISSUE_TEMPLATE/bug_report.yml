name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule involved
      description: Paste the output of `appwrangler rules` (or the rule's settings) for the affected app.
      render: text
  - type: input
    id: version
    attributes:
      label: AppWrangler version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.3, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: Activity log
      description: Settings → Activity, if relevant.
      render: text
