name: Release

# Push a tag (scripts/release.sh X.Y.Z does it) to test, build and publish.
# Run it by hand with dry_run to build everything without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (X.Y.Z, must have a CHANGELOG section)
        required: true
      dry_run:
        description: Build only; don't publish or touch the cask
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write   # MCP Registry login (GitHub OIDC); only used when vars.MCP_REGISTRY == 'on'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = push ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./test.sh

      - name: Build the zip
        run: ./build.sh --zip

      - name: Build the MCP bundle (.mcpb)
        run: scripts/build-mcpb.sh

      - name: Check the build
        run: |
          test -f "build/AppWrangler-mcp-$VERSION.mcpb"
          grep -q "\"version\": \"$VERSION\"" build/server.json
          APP=build/AppWrangler.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' $APP/Contents/Info.plist)" = "$VERSION"
          test -x $APP/Contents/MacOS/AppWranglerWatchdog
          test -d $APP/Contents/PlugIns/AppWranglerWidget.appex
          test -f $APP/Contents/Resources/Help/user-manual.md
          codesign --verify --strict --deep $APP

      - name: Release notes
        run: python3 scripts/release-notes.py "$VERSION" "build/AppWrangler-$VERSION.zip" > build/release-notes.md

      - name: Keep the build (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: AppWrangler-${{ env.VERSION }}
          path: |
            build/AppWrangler-${{ env.VERSION }}.zip
            build/AppWrangler-mcp-${{ env.VERSION }}.mcpb
            build/server.json
            build/release-notes.md

      - name: Publish the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/AppWrangler-$VERSION.zip" "build/AppWrangler-mcp-$VERSION.mcpb" --verify-tag \
            --title "AppWrangler $VERSION" --notes-file build/release-notes.md --latest

      - name: Update the Homebrew cask
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          SHA=$(shasum -a 256 "build/AppWrangler-$VERSION.zip" | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/appwrangler.rb
          if git diff --quiet; then echo "cask already up to date"; exit 0; fi
          git config user.name "IntarsO"
          git config user.email "30525407+IntarsO@users.noreply.github.com"
          git commit -am "Homebrew cask: AppWrangler $VERSION"
          git push origin main

      # Publishing to the official MCP Registry is opt-in:
      #   gh variable set MCP_REGISTRY --body on -R IntarsO/AppWrangler
      - name: Publish to the MCP Registry
        # Runs last, and a failure here doesn't fail the release.
        if: (github.event_name == 'push' || !inputs.dry_run) && vars.MCP_REGISTRY == 'on'
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_darwin_arm64.tar.gz" | tar xz mcp-publisher
          mkdir -p build/registry && cp build/server.json build/registry/server.json
          ./mcp-publisher login github-oidc
          (cd build/registry && ../../mcp-publisher publish)
